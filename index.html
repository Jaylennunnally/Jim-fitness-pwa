<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="JIM">
<meta name="theme-color" content="#0a1128"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.json">
<title>JIM</title>
<style>
:root{--bg:#0a1128;--card:#121c3a;--card2:#18244a;--ink:#f2f6ff;--mute:#8a9bc4;--baby:#8ecbff;--sky:#4fa8ff;--p:#ff5f8f;--c:#ffd166;--f:#7ae7c7;--ok:#5be39a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 6px) 0 calc(env(safe-area-inset-bottom) + 30px);-webkit-user-select:none;user-select:none}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 14px}
header h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.5px}header h1 small{display:block;font-size:13px;color:var(--mute);font-weight:600;letter-spacing:0}
.nav{display:flex;gap:8px}.nav button,.ghost{border:0;background:var(--card2);color:var(--baby);width:38px;height:38px;border-radius:50%;font-size:18px}
.card{background:var(--card);border-radius:22px;margin:0 14px 14px;padding:18px}.card h2{margin:0 0 12px;font-size:15px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.hero{display:flex;align-items:center;gap:18px}.hero svg{flex:none}.big{font-size:44px;font-weight:800;line-height:1}.sub{color:var(--mute);font-size:13px;margin-top:4px}
.eq{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;text-align:center;font-size:12px;color:var(--mute)}.eq b{display:block;color:var(--ink);font-size:18px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px}.macros b{display:block;font-size:16px;margin-top:6px}.macros span{font-size:12px;color:var(--mute)}
.meal{padding:12px 0;border-top:1px solid #ffffff12}.meal:first-of-type{border:0;padding-top:0}.mh{display:flex;justify-content:space-between;font-weight:700}.mh span{color:var(--baby)}
.it{display:flex;justify-content:space-between;font-size:14px;padding-top:7px;color:#d5def5}.it small{display:block;color:var(--mute);font-size:12px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center;font-size:11px;color:var(--mute)}
.col{height:100px;display:flex;align-items:flex-end;justify-content:center;background:var(--card2);border-radius:10px;overflow:hidden}.col div{width:100%;background:linear-gradient(var(--baby),var(--sky));border-radius:8px 8px 0 0}
.col.over div{background:linear-gradient(#ffb199,#ff6b6b)}.col.sel{outline:2px solid var(--baby)}
.stats{display:flex;justify-content:space-around;margin-top:14px;text-align:center;font-size:12px;color:var(--mute)}.stats b{display:block;font-size:19px;color:var(--ink)}
svg text{fill:var(--mute);font-size:10px}
.qa{display:flex;gap:8px;margin-bottom:10px}.qa input{flex:1;min-width:0;background:var(--card2);border:0;color:var(--ink);padding:13px;border-radius:14px;font-size:16px}
.qa button,.btn{border:0;background:var(--baby);color:#0a1128;border-radius:14px;padding:0 16px;font-weight:800;font-size:15px}
.empty{color:var(--mute);text-align:center;font-size:14px;padding:6px}#msg{text-align:center;font-size:13px;color:var(--ok);min-height:16px}
#status{font-size:11px;color:var(--mute);text-align:center;margin-top:-6px;margin-bottom:10px}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#16306e,#0a1128 70%);transition:opacity .35s}
#splash img{width:118px;height:118px;border-radius:27px;box-shadow:0 14px 40px #000a;animation:pop .6s ease}#splash p{color:var(--baby);font-weight:700;letter-spacing:2px;margin-top:20px}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#setup{display:none;padding:30px 22px}#setup h1{font-size:28px}#setup input{width:100%;margin:8px 0 16px;background:var(--card2);border:0;color:var(--ink);padding:14px;border-radius:14px;font-size:15px}#setup .btn{width:100%;height:50px}
#setup p{color:var(--mute);font-size:14px;line-height:1.45}
</style></head><body>
<div id="splash"><img src="icon-512.png" alt="JIM"><p>STAY LOCKED IN</p></div>
<section id="setup"><h1>Connect JIM</h1>
<p>One-time setup. Paste your Apps Script <b>/exec</b> link and the secret token you set with <code>setupToken</code>. They're saved only on this phone.</p>
<label>Web app URL</label><input id="sUrl" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off">
<label>Token</label><input id="sKey" placeholder="your secret token" autocapitalize="off" autocorrect="off">
<button class="btn" id="sGo">Connect</button><p id="sErr" style="color:#ff8a8a"></p></section>
<main id="app" style="display:none">
<header><h1 id="dlabel">Today<small id="dsub"></small></h1><div class="nav"><button id="prev">‹</button><button id="next">›</button><button id="ref">↻</button></div></header>
<div id="status"></div>
<div class="card"><h2>Calories</h2><div class="hero"><svg id="calRing" width="132" height="132"></svg><div><div class="big" id="left">–</div><div class="sub">remaining</div></div></div>
<div class="eq"><div><b id="goal">–</b>Goal</div><div><b id="eaten">–</b>Food</div><div><b id="pct">–</b>of goal</div></div></div>
<div class="card"><h2>Macros</h2><div class="macros" id="macros"></div></div>
<div class="card"><h2>Meals</h2><div id="meals"></div></div>
<div class="card"><h2>This week</h2><div class="week" id="week"></div><div class="stats" id="wstats"></div></div>
<div class="card"><h2>Weight</h2><div id="wt"></div></div>
<div class="card"><h2>Quick add</h2><div class="qa"><input id="qW" type="number" inputmode="decimal" placeholder="Weight (lb)"><button data-f="weight">Log</button></div>
<div class="qa"><input id="qH" type="number" inputmode="decimal" placeholder="Water (L)"><button data-f="water">Add</button></div><div id="msg"></div></div>
<p style="text-align:center"><button class="ghost" style="width:auto;padding:0 14px;border-radius:12px;font-size:12px" id="reset">Change connection</button></p>
</main>
<script src="app.js"></script></body></html>
